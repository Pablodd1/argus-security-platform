<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070b">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<meta name="description" content="ARGUS — autonomous security operations for small business. Evidence-adjudicated findings, detection timeline, kill switch.">
<title>ARGUS — Security Operations Command Center</title>
<style>
/* React 的挂载点不能占一层盒子：body 直接就是 flex / grid 容器，
   中间多一个 <div id="root"> 会掐断 height:100% 的参照链，撑满视口的版面
   会变成按内容无限长高（图表容器一长，ECharts 就画出十几屏那么高的图）。
   display:contents 让它不生成盒子，版面保持 body 到 #stage 的直接父子关系。 */
#root{display:contents}
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
